name: Dotrip CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [docs/ideation]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: dotrip-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PR Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verification tools
        run: |
          python3 -m venv "$RUNNER_TEMP/verify"
          bin="$RUNNER_TEMP/verify/bin"
          "$bin/pip" --disable-pip-version-check install ruff==0.17.6 mypy==1.18.2
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"

      - name: Verify tracked files, lint, types and behavior
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/verify.sh "$BASE_SHA"

      - name: Check linked issue, review and evidence
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pr.py
